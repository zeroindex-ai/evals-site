name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Build the static stylesheet before testing: the no-JIT class-check
      # (class-check.test.ts) asserts every class referenced in render.ts output
      # and public/**/*.html resolves to a rule in the built CSS. The test also
      # rebuilds it itself, but building here keeps the shipped artifact fresh.
      - run: pnpm build:css

      - run: pnpm test
